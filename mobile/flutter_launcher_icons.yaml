# The real Cargo Motives identity (Identity Sheet v3, final): a bold C
# holding an M in its counter — the M begins small inside the C's opening
# and grows as it runs out through the open side, finishing tall and heavy
# on the right — in the brand's own navy/orange palette (see
# assets/brand/logo_mark_reversed.svg, the single source of truth these
# PNGs are rendered from). One mark at every size, no simplified small-size
# variant. Replaces an earlier truck-mark draft that never matched the
# client's own final identity sheet.
flutter_launcher_icons:
  android: true
  ios: true
  image_path: "assets/icon/icon.png"
  adaptive_icon_background: "#16294B"
  adaptive_icon_foreground: "assets/icon/icon_foreground.png"
  remove_alpha_ios: true
