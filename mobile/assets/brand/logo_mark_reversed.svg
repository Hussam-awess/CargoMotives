<svg viewBox="22 32 200 184" xmlns="http://www.w3.org/2000/svg">
  <!-- Identity Sheet v3 (final, matched to the client's own reference PDF
       pixel-for-pixel) — a bold C holding an M in its counter: the M
       begins small inside the C's opening and grows as it runs out
       through the open side, finishing tall and heavy on the right. One
       mark everywhere, no simplified small-size variant. Bone + orange
       (the reference's "white" C is actually bone #F4EFE6, not pure
       white), for use on the brand navy (splash, welcome badge, anywhere
       the surface is already brandLogoNavy). See logo_mark.svg for the
       navy + orange variant used on light surfaces. -->

  <!-- C ring: centre (115,124), outer r=88, inner r=57, 38deg half-opening -->
  <path d="M 184.3 69.8
           A 88 88 0 1 0 184.3 178.2
           L 159.9 159.1
           A 57 57 0 1 1 159.9 88.9
           Z"
        fill="#F4EFE6"/>

  <!-- M nested in the C's opening: thin/short on the left, tall/heavy on
       the right. The valley notch is cut almost all the way to the
       baseline (163 of 167) so the two strokes read as a clear M rather
       than a solid wedge with a shallow dimple on top. -->
  <path d="M 109 167
           L 109 97
           L 126 97
           L 160 163
           L 193 53
           L 218 53
           L 218 167
           Z"
        fill="#E2621B"/>
</svg>
